<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#8C2C44"/>
    <stop offset="100%" stop-color="#3E0F1D"/>
  </linearGradient>
  <style>
    .bg { fill:#FBF7F5; }
    .ring { fill:none; stroke:#C98EA6; stroke-opacity:0.45; stroke-dasharray:2 10; stroke-linecap:round; }
    .node-circle { fill:#ffffff; stroke:#6E1E33; stroke-width:2.4; }
    .mono { fill:#3E0F1D; font-weight:700; text-anchor:middle; dominant-baseline:middle; }
    .lbl { fill:#7A5560; font-weight:500; text-anchor:middle; }
    .title { fill:#3E0F1D; font-weight:700; text-anchor:middle; }
    .subtitle { fill:#8A6069; font-weight:400; text-anchor:middle; }
    .hub-name { fill:#ffffff; font-weight:700; text-anchor:middle; dominant-baseline:middle; }
    .hub-role { fill:#F3D9DE; font-weight:400; text-anchor:middle; dominant-baseline:middle; }

    .node { opacity:0; transform-box: fill-box; transform-origin:center; animation: pop 0.55s cubic-bezier(.34,1.56,.64,1) forwards, breathe 3.6s ease-in-out infinite; }
    @keyframes pop { to { opacity:1; } }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .hub { transform-box: fill-box; transform-origin:center; animation: hubPop 0.6s cubic-bezier(.34,1.56,.64,1) both, glow 4s ease-in-out 0.6s infinite; }
    @keyframes hubPop { from{ opacity:0; transform:scale(0.4);} to{ opacity:1; transform:scale(1);} }
    @keyframes glow {
      0%,100% { filter:drop-shadow(0 0 0px rgba(110,30,51,0.0)); }
      50% { filter:drop-shadow(0 0 14px rgba(110,30,51,0.55)); }
    }
  </style>
</defs>

<rect class="bg" x="0" y="0" width="680" height="680" rx="26"/>

<text x="340" y="40" class="title" font-size="24">Mi Stack Tecnológico</text>
<text x="340" y="62" class="subtitle" font-size="12">Lenguajes · Frameworks · Bases de datos &amp; Herramientas</text>

<!-- decorative rotating rings -->
<g style="transform-origin:340px 360px">
  <circle class="ring" cx="340" cy="360" r="115"/>
  <circle class="ring" cx="340" cy="360" r="205">
    <animateTransform attributeName="transform" type="rotate" from="0 340 360" to="360 340 360" dur="60s" repeatCount="indefinite"/>
  </circle>
  <circle class="ring" cx="340" cy="360" r="285">
    <animateTransform attributeName="transform" type="rotate" from="360 340 360" to="0 340 360" dur="90s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- center hub -->
<g class="hub" style="animation-delay:0s">
  <circle cx="340" cy="360" r="95" fill="url(#hubGrad)"/>
  <text x="340" y="352" class="hub-name" font-size="20">Itzel Ortiz</text>
  <text x="340" y="374" class="hub-role" font-size="11">Fullstack Developer</text>
</g>

<!-- RING 1 — Lenguajes -->
<g class="node" style="animation-delay:0.15s">
  <circle class="node-circle" cx="340" cy="245" r="30"/>
  <text x="340" y="245" class="mono" font-size="14">TS</text>
  <text x="340" y="290" class="lbl" font-size="11">TypeScript</text>
</g>
